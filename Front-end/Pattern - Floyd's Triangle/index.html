<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>Pattern</title>
</head>

<body>
    <h1>Pattern: Floyd?s Triangle</h1>
    <form class="form" onsubmit="generatePattern(event)">
        <label>Input No of Rows :
            <input type="number" id="rows" min="1" max="10" required/>
        </label>
        <button 
            id="btn" 
            type="submit">Generate Pattern</button>
    </form>
    <table id="pattern">
    </table>

    <script src="script.js"></script>
</body>

</html>
