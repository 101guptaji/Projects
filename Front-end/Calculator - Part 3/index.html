<!DOCTYPE html>
<html>
<head>
  <title>Beautiful Calculator</title>

  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="calculator">
    <div class="display">
      <input type="text" id="result" readonly>
    </div>
    <div class="buttons">
      <button class="userinput operator">/</button>
      <button class="userinput operator">x</button>
      <button id="clear">C</button>
      <button class="userinput">7</button>
      <button class="userinput">8</button>
      <button class="userinput">9</button>
      <button class="userinput operator">-</button>
      <button class="userinput">4</button>
      <button class="userinput">5</button>
      <button class="userinput">6</button>
      <button class="userinput operator">+</button>
      <button class="userinput">1</button>
      <button class="userinput">2</button>
      <button class="userinput">3</button>
      <button id="calc" class="operator">=</button>
      <button class="userinput">0</button>
      <button class="userinput">.</button>
    </div>
  </div>
	
	<script src="script.js"></script>
</body>
</html>
