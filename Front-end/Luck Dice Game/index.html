<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>
    <script src="https://kit.fontawesome.com/b3348ae33f.js" crossorigin="anonymous"></script>
</head>

<body>
    <h1 style="text-align:center">Two Dice Luck Game</h1>
    <div class="playerIdentity">
        <!-- place person icon here with respective text -->
        <div class="playerTurn" id="p1">
            <i class="fa-solid fa-person-running yellow"></i>
            <span>Person1
        </div>
        <div id="p2">
            <i class="fa-solid fa-person-running purple"></i>
            <span>Person2
        </div>
    </div>

    <div class="gameBoard">
        <div class="relativePosition">
            <span class="labelled">Start</span>
            <!-- place icon here -->
            <div class="cell">
                <i class="fa-solid fa-person-running yellow"></i>
                <i class="fa-solid fa-person-running purple"></i>
            </div>
        </div>

        <!-- place eight more cell(element) -->
        <div class="cell" ></div>
        <div class="cell" ></div>
        <div class="cell" ></div>
        <div class="cell" ></div>
        <div class="cell" ></div>
        <div class="cell" ></div>
        <div class="cell" ></div>
        <div class="cell" ></div>

        <div class=" relativePosition">
            <span class="labelled">End</span>
            <div class="cell">
            </div>
        </div>
    </div>

    <div class="allDiceContainer">
        <div class="diceContainer">
            <div class="dice" id="dice1">
                <!-- place dice icon here -->
                <i class="fa-solid fa-dice"></i>
            </div>
            <h5>Dice 1</h5>
        </div>
        <div class="diceContainer">
            <div class="dice" id="dice2">
                <!-- place dice icon here -->
                <i class="fa-solid fa-dice"></i>
            </div>
            <h5>Dice 2</h5>
        </div>
    </div>

    <div class="gameInfo">
        <p>Total Points : <span id="totalPoints">0</span></p>
        <h3 id="result"></h3>
    </div>

    <div class="allBtns">
        <button class="btn rollBtn" onclick="rollDice()">
            Roll Dice
        </button>
        <button class="resetBtn btn" onclick="resetGame()">
            Reset Game
        </button>
    </div>
</body>

</html>
